# CI runs lint plus the tier-1 (synthetic) test suite only (plan §6, §12).
# Audio-dependent tests skip automatically: SWINGSCRIBE_FIXTURES is never set here.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: lint + synthetic tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Tests (tier 1)
        run: uv run pytest
