# SwingScribe default configuration — one object threaded through the pipeline.
# Each top-level section below maps to one pipeline stage; stage configs feed
# the cache key, so changing a value here invalidates that stage and everything
# downstream of it (plan §3).

cache_dir: .swingscribe-cache

ingest:
  sample_rate: 44100

separate:
  # htdemucs_ft is a bag of FOUR models and takes 4x as long for no measured
  # gain (0.759 vs 0.752 mean note F1 over 9 benchmark solos). htdemucs_6s is
  # worth picking by hand for a horn solo over a pianist. See config.py.
  model: htdemucs           # or bsroformer_sw: BS-Roformer-SW via the `roformer` group,
                            # ~9x slower and measurably better on horns (docs/separation-research.md)
  device: auto              # auto | cuda | cpu; auto picks cuda when available (demucs only)
  span: null                # [start, end] seconds to separate instead of the whole file; the
                            # GUI sets it from the selection, the batch from the located solo
  span_margin_s: 3.0        # context either side of the span, for the model

beats:
  dbn: false                # never true — we skip madmom entirely (§2)
  use_drum_stem: true       # ride cymbal is the cleanest beat reference (§5)
  checkpoint: final0        # beat_this checkpoint name
  device: auto              # auto | cuda | cpu
  min_drum_mix_ratio: 0.05  # drum stem needs ≥5% of mix RMS, else full-mix fallback
  tempo_hint: null          # known BPM; fixes half/double octave errors (--tempo-hint)

transcribe:
  ensemble: horn-led        # horn-led | trio | solo-piano (§5 stage 3)
  stem: other               # which stem carries the solo; 6s model adds guitar/piano
  region: null              # [start, end] seconds, or null for the whole track
  fmin_hz: 55.0             # A1, bari sax bottom — constrains CREPE against octave errors
  fmax_hz: 1600.0           # ~G6, above alto altissimo
  crepe_model: full         # full | tiny (tiny ~10x faster on CPU, less accurate)
  device: auto              # auto | cuda | cpu
  voicing_threshold: 0.5    # CREPE periodicity gate; above docs' 0.21 — stem bleed is pitched
  silence_floor_db: -40.0   # frame RMS gate vs the stem's loud reference; kills quiet bleed
  onset_rise_db: 3.0        # onset splits a held note only if ITS harmonics re-attack
  onset_window_ms: 60.0     # lookback/lookahead for that rise
  min_note_ms: 60.0         # drop specks shorter than a fast bebop 16th
  pitch_persist_ms: 60.0    # new pitch must hold this long to split a note (scoops don't)
  silence_gap_ms: 40.0      # bridge unvoiced dropouts shorter than this
  median_filter_ms: 50.0    # f0 median-filter kernel — flattens vibrato

meter:
  # Bar lines are derived by counting beats from an anchor, NOT from the beat
  # tracker's detected downbeats (that layer is noise — open-issue #5).
  # Runs after transcribe deliberately: moving a downbeat then re-runs only
  # swing/quantize, never CREPE and never separation (docs/meter-plan.md).
  time_signature: null      # "4/4" | "3/4" | "6/8" | "6/4" | ...; null = 4/4
  pulses_per_bar: null      # tracked beats per bar; null = from time signature
  anchor: null              # seconds; a beat that is beat 1. null = auto-detect
  bars_per_chorus: null     # heavier line every N bars (12-bar blues, 32-bar form)
  form_start: null          # seconds; where bar 1 is — skips an intro. null = first bar
  extend_to_edges: true     # continue a steady pulse into a head/tail with no beats
  max_extend_seconds: 12.0  # ...but no further than this, so a free intro stays bare
  repair_beats: true        # fill in beats the tracker dropped
  max_implied_run: 8        # wider gaps break the span instead of being filled
  stability_tolerance: 0.15 # interval must be within this of the local median
  min_span_beats: 8         # shorter stable runs get no bar lines (rubato)

swing:
  window_beats: 16          # sliding window for BUR estimation (§5 stage 4)

quantize:
  resolution: 16            # straight-grid resolution, 16th notes (§5 stage 5)

notate:
  transposition: C          # C | Eb | Bb — transposing instruments (§5 stage 6)

export:
  formats: [musicxml, midi, json]

# The local selection/audition GUI (§13). Not a pipeline stage: nothing here
# feeds a cache key, so changing it never invalidates a separation.
gui:
  host: 127.0.0.1           # localhost only — it serves local files by path
  port: 8420
  open_browser: true
  library_dir: null         # where the track picker looks; null = current directory
  models: [htdemucs, htdemucs_6s, htdemucs_ft, bsroformer_sw]   # menu order, fast first
