<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwingScribe — User guide</title>
<style>
  /* Same palette as src/swingscribe/gui/static/style.css, kept in sync by
     hand — this page has no build step and does not import that file. */
  :root {
    --bg: #0e0f13;
    --panel: #161821;
    --panel-2: #1c1f2b;
    --line: #272b3a;
    --text: #e6e8ef;
    --muted: #878da3;
    --accent: #f0a848;
    --accent-dim: rgba(240, 168, 72, 0.14);
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --radius: 7px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky; top: 0;
  }
  header .brand { font-weight: 700; letter-spacing: 0.02em; }
  header .sub { color: var(--muted); font-size: 13px; }
  .page {
    max-width: 820px;
    margin: 0 auto;
    padding: 28px 24px 80px;
  }
  h1, h2, h3 { font-weight: 600; line-height: 1.3; scroll-margin-top: 60px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  h2 { font-size: 19px; margin: 34px 0 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  h3 { font-size: 15px; margin: 20px 0 6px; color: var(--text); }
  p { margin: 10px 0; }
  ul, ol { margin: 10px 0; padding-left: 24px; }
  li { margin: 5px 0; }
  code {
    font: 0.88em var(--mono);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }
  pre {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    overflow-x: auto;
  }
  pre code { background: none; border: none; padding: 0; }
  kbd {
    font: 11px var(--mono);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }
  strong { color: var(--text); }
  em { color: var(--text); }
  nav.toc {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    margin: 22px 0;
  }
  nav.toc .toc-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--muted); margin-bottom: 8px;
  }
  nav.toc ol { margin: 0; padding-left: 20px; columns: 2; column-gap: 24px; }
  nav.toc li { margin: 3px 0; break-inside: avoid; }
  nav.toc a { text-decoration: none; }
  nav.toc a:hover { text-decoration: underline; }
  .error {
    color: var(--danger, #e2666b);
    border: 1px solid var(--danger, #e2666b);
    background: rgba(226, 102, 107, 0.1);
    border-radius: var(--radius);
    padding: 12px 14px;
    font: 13px var(--mono);
  }
</style>
</head>
<body>

<header>
  <span class="brand">SwingScribe</span>
  <span class="sub">User guide</span>
</header>

<div class="page">
  <div id="toc-slot"></div>
  <div id="content">Loading…</div>
</div>

<script type="module">
/* A hand-rolled Markdown renderer for exactly the subset user-guide.md is
   written in: #/##/### headings, paragraphs, one-level "- " and "1. " lists,
   fenced ``` code blocks, inline `code`, **bold**, *italic*, [links](url),
   and literal <kbd>…</kbd> passed through. Nothing else is supported —
   tables, nested lists, blockquotes, rules and images will not render as
   you'd expect, so the guide itself never uses them. No library, by design
   (see docs/gui-design.md — this frontend has no build step). */

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Only these two raw tags survive escaping, unwrapped back to literal HTML.
function allowKbd(s) {
  return s.replace(/&lt;kbd&gt;/g, '<kbd>').replace(/&lt;\/kbd&gt;/g, '</kbd>');
}

function slugify(text) {
  return text.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// Inline rules, applied in an order that keeps them from fighting each other:
// escape first, then code spans (so ** inside `code` is inert), then bold,
// then italic, then links.
function inline(raw) {
  let s = allowKbd(escapeHtml(raw));
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, (_, c) => `<strong>${c}</strong>`);
  s = s.replace(/\*([^*]+)\*/g, (_, c) => `<em>${c}</em>`);
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) =>
    `<a href="${escapeHtml(u)}" target="_blank" rel="noopener">${t}</a>`);
  return s;
}

function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  const toc = [];
  let html = '';
  let i = 0;
  const isBoundary = (l) =>
    l.trim() === '' || /^#{1,3}\s/.test(l) || /^```/.test(l) || /^- /.test(l) || /^\d+\.\s/.test(l);

  while (i < lines.length) {
    const line = lines[i];

    if (line.startsWith('```')) {
      i++;
      const code = [];
      while (i < lines.length && !lines[i].startsWith('```')) { code.push(lines[i]); i++; }
      i++; // consume the closing fence
      html += `<pre><code>${escapeHtml(code.join('\n'))}</code></pre>\n`;
      continue;
    }

    const heading = line.match(/^(#{1,3})\s+(.*)$/);
    if (heading) {
      const level = heading[1].length;
      const text = heading[2];
      const id = slugify(text);
      html += `<h${level} id="${id}">${inline(text)}</h${level}>\n`;
      if (level === 2) toc.push({ id, text });
      i++;
      continue;
    }

    // A list item runs on until the next item, a blank line, or another
    // block: the guide wraps long items across lines, as Markdown allows.
    const collectItem = (first) => {
      const parts = [first];
      i++;
      while (i < lines.length && !isBoundary(lines[i])) { parts.push(lines[i].trim()); i++; }
      return parts.join(' ');
    };

    if (/^- /.test(line)) {
      const items = [];
      while (i < lines.length && /^- /.test(lines[i])) items.push(collectItem(lines[i].slice(2)));
      html += '<ul>' + items.map((it) => `<li>${inline(it)}</li>`).join('') + '</ul>\n';
      continue;
    }

    if (/^\d+\.\s/.test(line)) {
      const items = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) {
        items.push(collectItem(lines[i].replace(/^\d+\.\s/, '')));
      }
      html += '<ol>' + items.map((it) => `<li>${inline(it)}</li>`).join('') + '</ol>\n';
      continue;
    }

    if (line.trim() === '') { i++; continue; }

    const para = [];
    while (i < lines.length && !isBoundary(lines[i])) { para.push(lines[i]); i++; }
    html += `<p>${inline(para.join(' '))}</p>\n`;
  }

  return { html, toc };
}

function renderToc(toc) {
  if (!toc.length) return '';
  const items = toc.map((t) => `<li><a href="#${t.id}">${inline(t.text)}</a></li>`).join('');
  return `<nav class="toc"><div class="toc-title">Contents</div><ol>${items}</ol></nav>`;
}

async function load() {
  const contentEl = document.getElementById('content');
  const tocEl = document.getElementById('toc-slot');
  try {
    const response = await fetch('./user-guide.md');
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    const md = await response.text();
    const { html, toc } = renderMarkdown(md);
    tocEl.innerHTML = renderToc(toc);
    contentEl.innerHTML = html;
  } catch (error) {
    contentEl.innerHTML =
      `<p class="error">Could not load the guide (./user-guide.md): ${escapeHtml(String(error.message || error))}</p>`;
  }
}

load();
</script>
</body>
</html>
