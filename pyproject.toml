[project]
name = "swingscribe"
version = "0.1.0"
description = "Jazz audio in → instrument-separated, swing-aware notation out"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
# Deps are added at the milestone that needs them (torch/demucs at M1,
# beat_this at M2, piano model at M7b). M0 needs only the data-contract
# and config stack.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.scripts]
swingscribe = "swingscribe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Heavy ML stack (M1+). Not a default group, so plain `uv sync` — and
# therefore CI — never installs it. Dev machines opt in once:
#   uv sync --group ml
ml = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "demucs>=4.0",
    "soundfile>=0.12",
]

[tool.uv]
# No macOS until something deploys there (M8 at the earliest).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
# The original dev machine has no NVIDIA GPU, so torch comes from the CPU
# index (~200MB instead of ~2.7GB CUDA wheels). On a CUDA machine, switch
# the URL to https://download.pytorch.org/whl/cu124 (plan §8).
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swingscribe"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
